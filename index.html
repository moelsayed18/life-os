<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColorMeta" content="#F1F3F6">
<title>Life OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life OS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface2:#F5F6F9; --ink:#111728; --muted:#586179; --line:#DDE1E9; --line2:#C6CDDA;
  --accent:#3558C8; --on:#FFFFFF; --danger:#B4372B; --good:#2A8A55;
  --c-morning:#C47A08; --c-hygiene:#12879A; --c-work:#3B66CF; --c-learning:#7C4FCB; --c-mind:#C6428A;
  --c-body:#2B9058; --c-spiritual:#0D6A62; --c-relationships:#D1573A; --c-evening:#383C93;
  --f-display:"Bricolage Grotesque","Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-s:9px; --r-m:14px; --r-l:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1120; --surface:#161B2E; --surface2:#1C2238; --ink:#E7EBF5; --muted:#9AA4BB; --line:#2A3250; --line2:#39426A;
    --accent:#7C9CF0; --on:#0D1120; --danger:#F08A7E; --good:#5CCB8A;
    --c-morning:#F0AE45; --c-hygiene:#4CC4D6; --c-work:#7C9CF0; --c-learning:#B08BF0; --c-mind:#F07AB8;
    --c-body:#5CCB8A; --c-spiritual:#4CC2B4; --c-relationships:#F58A6C; --c-evening:#8E93F0;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#161B2E; --surface2:#1C2238; --ink:#E7EBF5; --muted:#9AA4BB; --line:#2A3250; --line2:#39426A;
  --accent:#7C9CF0; --on:#0D1120; --danger:#F08A7E; --good:#5CCB8A;
  --c-morning:#F0AE45; --c-hygiene:#4CC4D6; --c-work:#7C9CF0; --c-learning:#B08BF0; --c-mind:#F07AB8;
  --c-body:#5CCB8A; --c-spiritual:#4CC2B4; --c-relationships:#F58A6C; --c-evening:#8E93F0;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px);-webkit-text-size-adjust:100%;background:var(--bg);overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{-webkit-tap-highlight-color:transparent}
@media (hover:none){
  .btn:active:not(:disabled),.iconb:active:not(:disabled),.toggle:active,.tab:active,.sm:active,.chipb:active,.tick:active{transform:scale(.95)}
  .row:active,.tile:active,.wd:active:not(:disabled),.nb:active,.goal:active,.xcard:active,.rcard:active{background:color-mix(in srgb,var(--ink) 6%,transparent)}
}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
#nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:26px 14px 18px;display:flex;flex-direction:column;gap:4px;border-inline-end:1px solid var(--line);overflow-y:auto}
.brand{font:700 25px var(--f-display);letter-spacing:-.02em;margin:0 12px 20px}
#nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nb{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-s);background:none;text-align:start;color:var(--muted);font-weight:500}
.nb svg{width:22px;height:22px;flex:none}
.nb:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
.nb[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.nset{margin-top:auto}
#sync{padding:12px 12px 0;font-size:13px;color:var(--muted);line-height:1.45}
#sync b{color:var(--ink);font-weight:600}
main{min-width:0;padding-bottom:48px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 98%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--bg)}
.topin,#view{max-width:860px;margin:0 auto}
main.wide .topin,main.wide #view{max-width:1120px}
.topin{padding:12px 20px 12px}
.toprow{display:flex;align-items:center;gap:10px;min-height:44px}
.ttl{font:700 26px/1.1 var(--f-display);letter-spacing:-.02em}
.daynav{display:flex;align-items:center;gap:10px;min-width:0}
.dtitle{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.dtitle .sub{font-size:13px;color:var(--muted)}
.spacer{flex:1}
.pct{font-size:14px;color:var(--muted);white-space:nowrap}
.pct b{font:700 22px var(--f-display);color:var(--ink);letter-spacing:-.02em;margin-inline-start:4px}
.arc{display:flex;gap:3px;height:8px;margin-top:10px}
.is-today .arc{height:14px}
.seg{position:relative;padding:0;border:0;border-radius:6px;overflow:hidden;min-width:8px;background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.seg i{position:absolute;top:0;bottom:0;inset-inline-start:0;background:var(--c);border-radius:6px;transition:width .35s ease}
.gear{display:none}
#view{padding:8px 20px 24px}

/* controls */
.viewhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
.viewhead h2{font-size:24px}
.viewhead h3{font-size:19px}
.iconb{display:grid;place-items:center;width:42px;height:42px;flex:none;border:1px solid var(--line2);border-radius:var(--r-s);background:var(--surface)}
.iconb svg{width:18px;height:18px}
.iconb:disabled{opacity:.35;cursor:default}
.iconb:hover:not(:disabled){background:var(--surface2)}
.iconb[aria-pressed="true"]{background:color-mix(in srgb,var(--c-morning) 16%,var(--surface));border-color:var(--c-morning);color:var(--c-morning)}
.btn{min-height:42px;padding:8px 16px;border:1px solid var(--line2);border-radius:var(--r-s);background:var(--surface);font-weight:500}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 86%,var(--bg))}
.btn.dng{border-color:var(--danger);color:var(--danger)}
.btn.sm2{min-height:34px;padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 16px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);font-weight:500}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle.ok{border-color:var(--good);color:var(--good);font-weight:600}
.toggle.ok[aria-pressed="true"]{background:var(--good);color:var(--on)}
.hint{color:var(--muted);font-size:14px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r-m)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.panel{margin-top:28px}
.panel>h3{font-size:19px;margin-bottom:10px}
.subtabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface2);overflow-x:auto;margin:14px 0 6px;width:max-content;max-width:100%;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.tab{min-height:38px;padding:6px 16px;border:0;border-radius:9px;background:none;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"],.tab[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-s);background:var(--surface);color:var(--ink)}
input.inp,textarea.inp{-webkit-appearance:none;appearance:none}
textarea.inp{min-height:76px;resize:vertical;line-height:1.5}
.lbl{display:grid;gap:6px;margin-top:16px}
.lbl>span{font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.msg{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--surface2);border:1px solid var(--line)}
.nudge{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:var(--r-m);background:color-mix(in srgb,var(--c-morning) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c-morning) 45%,var(--line));font-size:14px}
.nudge span{flex:1 1 220px}

/* today */
.next{position:relative;display:flex;align-items:center;gap:16px;margin-top:16px;padding:20px 20px 20px 26px;border-radius:var(--r-l);background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 38%,var(--line));overflow:hidden}
.next::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:7px;background:var(--c)}
.nx-body{flex:1;min-width:0}
.nx-k{display:block;font-size:14px;color:color-mix(in srgb,var(--c) 55%,var(--ink))}
.nx-name{display:block;font:700 28px/1.15 var(--f-display);letter-spacing:-.02em;margin-top:4px;text-wrap:balance;unicode-bidi:plaintext}
.nx-meta{display:block;font-size:14px;color:var(--muted);margin-top:6px}
.nx-do{flex:none;display:grid;place-items:center;width:66px;height:66px;border:0;border-radius:50%;background:var(--c);color:var(--on);transition:transform .12s}
.nx-do svg{width:30px;height:30px}
.nx-do:active{transform:scale(.93)}
.next.all .nx-name{font-size:24px}
.rule{margin-top:14px;font-size:15px;color:var(--muted)}
.rule b{font:600 15px var(--f-display);color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{display:grid;gap:4px;justify-items:center;padding:8px 2px 6px;border:1.5px solid transparent;border-radius:12px;background:none}
.wd .wl{font-size:12px;color:var(--muted)}
.wd .wb{position:relative;width:100%;max-width:36px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.wd .wb i{position:absolute;inset-inline:0;bottom:0;background:var(--accent);opacity:.85}
.wd .wn{font-size:13px;font-weight:600}
.wd.sel{background:var(--surface);border-color:var(--ink)}
.wd.now .wn{color:var(--accent)}
.wd:disabled{opacity:.4;cursor:default}
.prio{margin-top:24px}
.prio h3{font-size:19px;margin-bottom:2px}
.prow{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.pn{width:26px;text-align:center;font:700 19px var(--f-display);color:var(--muted);flex:none}
.pin{flex:1;min-width:0;border:0;background:none;padding:14px 0;font:inherit;color:var(--ink);unicode-bidi:plaintext}
.pin:focus-visible{outline-offset:-2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:20px}
.tile{display:block;text-align:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.tile span{display:block;font-size:13px;color:var(--muted)}
.tile b{display:block;font:700 17px/1.3 var(--f-display);margin-top:2px}
.tile.done{border-color:var(--good)}
.tile:hover{background:var(--surface2)}

/* route lines: habit sections */
.line{margin-top:22px;scroll-margin-top:170px}
.linehead{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:4px 6px;border:0;background:none;text-align:start}
.lname{font:700 19px var(--f-display);letter-spacing:-.01em}
.lname::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-inline-end:10px;vertical-align:1px}
.lcount{margin-inline-start:auto;color:var(--muted);font-size:14px}
.line.full .lcount{color:var(--good);font-weight:600}
.linehead svg{width:18px;height:18px;color:var(--muted);flex:none;transition:transform .15s}
.line.folded .linehead svg{transform:rotate(-90deg)}
.stops{list-style:none;margin:4px 0 0;padding:4px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;--trk:color-mix(in srgb,var(--c) 26%,var(--surface))}
.stops .row{border-bottom:0}
.stops .row::before,.stops .row::after{content:"";position:absolute;inset-inline-start:27.5px;width:3px;background:var(--trk)}
.stops .row::before{top:0;bottom:50%}
.stops .row::after{top:50%;bottom:0}
.stops li:first-child .row::before,.stops li:last-child .row::after{display:none}
.stops .row.lu::before,.stops .row.ld::after{background:var(--c)}
.stops .box{border-radius:50%}
.stops .row:hover{background:color-mix(in srgb,var(--c) 6%,transparent)}

/* rows and checkboxes */
.sec{margin-top:24px;scroll-margin-top:150px}
.sech{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sech h3{font-size:19px}
.sech .cnt{margin-inline-start:auto;color:var(--muted);font-size:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;border-inline-start:4px solid var(--c)}
.row{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:8px 16px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start}
.row:last-child{border-bottom:0}
.box{position:relative;z-index:1;width:26px;height:26px;border-radius:8px;border:2px solid color-mix(in srgb,var(--c) 60%,var(--line));background:var(--surface);display:grid;place-items:center;flex:none;transition:background .12s,border-color .12s}
.box svg{width:16px;height:16px;opacity:0}
.box.pop{animation:pop .2s ease-out}
@keyframes pop{50%{transform:scale(1.2)}}
.row.on .box{background:var(--c);border-color:var(--c);color:var(--on)}
.row.on .box svg{opacity:1}
.hn{flex:1;unicode-bidi:plaintext}
.row.on .hn{color:var(--muted)}
.mb{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

/* month grid */
.gridwrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);margin-top:12px}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
.grid th,.grid td{padding:0;text-align:center;border-bottom:1px solid var(--line);background:var(--surface)}
.grid thead th{position:sticky;top:0;z-index:2;height:36px;min-width:26px;font-weight:500;color:var(--muted)}
.grid .hcol{position:sticky;inset-inline-start:0;z-index:1;min-width:180px;max-width:180px;padding:0 12px;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-inline-end:1px solid var(--line)}
.grid thead .hcol{z-index:3}
.grid tr.sh td{background:var(--surface2);text-align:start;padding:6px 12px;font-weight:600;font-size:13px}
.grid tr.sh td::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--c);margin-inline-end:8px}
.grid td.pc,.grid th.pc{min-width:52px;color:var(--muted);font-size:12px}
.grid th.tc{color:var(--accent);font-weight:700}
.cell{display:block;width:22px;height:22px;margin:6px auto;border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:6px;background:none;padding:0}
.cell.on{background:var(--c);border-color:var(--c)}
.cell:disabled{opacity:.25;cursor:default}
.grid tr.tot td{font-weight:600;font-size:12px;height:34px;position:sticky;bottom:0;z-index:2;border-top:1px solid var(--line)}

/* reviews */
.ctx{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:16px 0 4px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.ctx strong{font:700 24px var(--f-display)}
.meter{flex:1;min-width:140px;height:8px;border-radius:6px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fact{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px}
.fact b{font-weight:600}
.rgroup{margin-top:24px}
.rgroup>h3{font-size:19px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.rgroup>h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.rgroup .body{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px 16px;border-inline-start:4px solid var(--c)}
.rgroup .row{padding-inline:0;min-height:48px}
.rate{padding-top:14px;display:grid;gap:8px}
.rate>span,.rgroup .lbl>span{font-weight:500}
.chips{display:flex;gap:6px}
.chipb{width:44px;height:40px;border:1px solid var(--line2);border-radius:var(--r-s);background:var(--surface2);font-weight:600}
.chipb.on{background:var(--c);border-color:var(--c);color:var(--on)}
.note{padding:8px 12px;font-size:14px;min-height:40px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.kpi{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.kpi b{display:block;font:700 28px/1.15 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.chart svg{display:block;width:100%;height:auto}
.bars{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.bar{display:grid;grid-template-columns:130px 1fr 48px;align-items:center;gap:10px;font-size:14px}
.bar .t{height:10px;border-radius:6px;background:color-mix(in srgb,var(--c,var(--accent)) 18%,var(--surface));overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--c,var(--accent));border-radius:6px}
.bar .v{color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.rank{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 16px}
.rank h4{margin:0 0 6px;font-size:15px}
.rank div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.insights{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.insights li{padding:12px 14px;border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:var(--r-s);background:var(--surface)}

/* goals, rules, minimum day */
.today-rule{margin-top:14px;padding:24px 22px;border-radius:var(--r-l);background:var(--ink);color:var(--bg)}
.today-rule .en{font:700 26px/1.25 var(--f-display);letter-spacing:-.02em}
.rules{list-style:none;padding:0;margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.rules li{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.rules li:last-child{border-bottom:0}
.minbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:2px 16px}
.minbox .row{padding-inline:0}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;border-inline-start:4px solid var(--c)}
.goal.dn{opacity:.65}
.goal h4{font-size:18px}

    hs.forEach(function(h){
      var x=by[h.s]||(by[h.s]={done:0,total:0});
      var p=per[h.id]||(per[h.id]={done:0,total:0});
      x.total++;p.total++;total++;
      if(isDone(h.id,d)){x.done++;p.done++;done++;any=true;}
    });
    if(any)logged++;
    days++;d=addDays(d,1);guard++;
  }
  return {done:done,total:total,pct:total?Math.round(done*100/total):0,by:by,per:per,days:days,logged:logged};
}
function streaks(){
  var t=todayStr(),cur=0,best=0,run=0,d,i;
  for(i=400;i>=0;i--){d=addDays(t,-i);if(minOK(d)){run++;if(run>best)best=run;}else{run=0;}}
  d=t;if(!minOK(d))d=addDays(t,-1);
  while(minOK(d)&&cur<400){cur++;d=addDays(d,-1);}
  return {cur:cur,best:best};
}

function programStatus(){

  var days=Math.round((parseD(todayStr())-parseD(p.start))/86400000);
  if(days<0)return {upcoming:true,start:p.start};
  var weeks=p.weeks||12,deload=p.deload||4,week=Math.floor(days/7)+1;
  if(week>weeks)return {done:true,weeks:weeks};
  var block=Math.ceil(week/deload),isDeload=(week%deload===0),isTest=(week===1||isDeload);
  return {week:week,weeks:weeks,block:block,isDeload:isDeload,isTest:isTest};
}

function exById(id){return state.exercises.find(function(x){return x.id===id;});}
function planById(id){return state.plans.find(function(x){return x.id===id;});}
function parseRange(str){var m=String(str||'').match(/(\d+(?:\.\d+)?)(?:\s*[-\u2013]\s*(\d+(?:\.\d+)?))?/);if(!m)return [8,12];var lo=+m[1],hi=m[2]?+m[2]:lo;return [lo,hi];}
function e1rm(w,r){if(!(w>0)||!(r>0))return 0;return w*(1+Math.min(r,12)/30);}
function exHistory(exId,before){
  var out=[];
  Object.keys(state.workouts).sort().forEach(function(d){
    if(before&&d>=before)return;
    (state.workouts[d].x||[]).forEach(function(x){
      if(x.e!==exId)return;

      if(sets.length)out.push({date:d,sets:sets});
    });

function metricOf(ex,sets){
  if(!ex)return 0;
  if(ex.t==='lift'){return Math.max.apply(null,sets.map(function(s){return e1rm(s[0],s[1]);}).concat([0]));}
  if(ex.t==='bw'||ex.t==='time'){return Math.max.apply(null,sets.map(function(s){return +s[1]||0;}).concat([0]));}
  return sets.reduce(function(a,s){return a+(+s[1]||0);},0);
}
function setStr(ex,s){
  if(!ex)return '';

  if(ex.t==='bw')return (s[0]>0?'+'+fmt(s[0])+'kg ':'')+fmt(s[1])+' reps';
  if(ex.t==='time')return fmt(s[1])+'s';
  return fmt(s[1])+' min'+(s[0]>0?' \u00B7 '+fmt(s[0])+' km':'');
}
function suggestFor(ex,range,date){
  var hist=exHistory(ex.id,date),last=hist[hist.length-1];
  if(!last){return {w:'',r:ex.t==='cardio'?'':range[0],hint:ex.t==='cardio'?'':'First time. Pick a weight you can control.'};}
  var top=Math.max.apply(null,last.sets.map(function(s){return +s[0]||0;}));
  if(ex.t==='lift'){
    var atTop=last.sets.filter(function(s){return (+s[0]||0)===top;});
    var hit=atTop.every(function(s){return s[1]>=range[1];});
    if(hit&&ex.inc>0){return {w:Math.round((top+ex.inc)*100)/100,r:range[0],hint:'You hit '+fmt(range[1])+' reps on every set. Go up to '+fmt(top+ex.inc)+' kg.'};}
    var mr=Math.max.apply(null,atTop.map(function(s){return +s[1]||0;})),tr=Math.min(range[1],mr+1);
    return {w:top,r:tr,hint:'Same weight. Aim for '+fmt(tr)+' reps.'};
  }
  if(ex.t==='bw'){
    var m2=Math.max.apply(null,last.sets.map(function(s){return +s[1]||0;}));
    if(m2>=range[1])return {w:top||'',r:range[1],hint:'You hit '+fmt(range[1])+'. Add weight or use a harder variation.'};
    return {w:top||'',r:Math.min(range[1],m2+1),hint:'Aim for '+fmt(m2+1)+' reps.'};
  }
  if(ex.t==='time'){var m3=Math.max.apply(null,last.sets.map(function(s){return +s[1]||0;}));return {w:'',r:m3+5,hint:'Try '+fmt(m3+5)+' seconds.'};}
  return {w:'',r:'',hint:''};
}
function buildSession(planId,date){
  var pl=planId?planById(planId):null,x=[];
  if(pl){pl.items.forEach(function(it){
    var ex=exById(it.e);if(!ex)return;
    var sg=suggestFor(ex,parseRange(it.reps),date),sets=[],n=ex.t==='cardio'?1:(it.sets||3);
    for(var i=0;i<n;i++)sets.push([sg.w,sg.r,'',0]);
    x.push({e:it.e,s:sets});
  });}
  return {n:pl?pl.n:'Workout',p:planId||'',x:x,nt:''};
}
function sessionDone(sess){return (sess.x||[]).some(function(x){return x.s.some(function(s){return s[3]===1;});});}
function sessionVolume(sess){
  var v=0;(sess.x||[]).forEach(function(x){var ex=exById(x.e);if(ex&&ex.t==='lift')x.s.forEach(function(s){if(s[3]===1)v+=(+s[0]||0)*(+s[1]||0);});});return Math.round(v);

function sessionSets(sess){var n=0;(sess.x||[]).forEach(function(x){x.s.forEach(function(s){if(s[3]===1)n++;});});return n;}

function bestBefore(exId,date){var b=0;exHistory(exId,date).forEach(function(h){var m=metricOf(exById(exId),h.sets);if(m>b)b=m;});return b;}
function groupSets(a,b){
  var out={};
  Object.keys(state.workouts).forEach(function(d){
    if(d<a||d>b)return;
    (state.workouts[d].x||[]).forEach(function(x){var ex=exById(x.e);if(!ex)return;var n=x.s.filter(function(s){return s[3]===1;}).length;if(n)out[ex.g]=(out[ex.g]||0)+n;});

function bodyOf(ds){return state.body[ds]||{};}
function periodFacts(a,b){
  var t=todayStr(),end=b<t?b:t,o={workouts:0,volume:0,sleep:0,sleepN:0,wchg:null,focus:0,stretch:0};
  if(end<a)return o;
  var d=a,ws=[],g=0;

    var w=state.workouts[d];if(w&&sessionDone(w)){o.workouts++;o.volume+=sessionVolume(w);}
    var bd=state.body[d];if(bd){if(bd.sl>0){o.sleep+=bd.sl;o.sleepN++;}if(bd.wt>0)ws.push(bd.wt);}

var saveT=null,pushT=null,dirty={},sync={refs:null,busy:false,checked:false},lastPull=0,toastT=null;
function touch(){

}
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(function(){persistLocal();schedulePush();},450);}
function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){storageOK=false;if(!sync.refs)setSync('none');}syncReminderStatus();}
var idbP=null;
function idbOpen(){

function schedulePush(){if(!sync.refs)return;clearTimeout(pushT);pushT=setTimeout(pushRemote,1200);}
function pick(part){var o={};DOCS[part].forEach(function(k){o[k]=state[k];});return o;}
function byteLen(s){try{return new TextEncoder().encode(s).length;}catch(e){return s.length;}}
async function pushRemote(){
  if(!sync.refs)return;
  if(sync.busy){schedulePush();return;}
  sync.busy=true;
  try{
    var parts=Object.keys(dirty),bad=false;
    for(var i=0;i<parts.length;i++){
      var p=parts[i],json=JSON.stringify(pick(p));
      if(byteLen(json)>245000){bad=true;continue;}
      await sync.refs[p].set({updated:state.ts[p],json:json});
      delete dirty[p];
    }
    setSync(bad?'big':'synced');
  }catch(e){
    ui.syncErr=(e&&e.message)||'';setSync('error');
    if(Object.keys(dirty).length&&!(e&&(e.status===401||e.status===403||e.status===404))){clearTimeout(pushT);pushT=setTimeout(pushRemote,30000);}
  }
  sync.busy=false;
}
function setSync(st){ui.sync=st;var el=$('#sync');if(el)el.innerHTML=syncHTML();}
function syncHTML(){
  var m={
    synced:'<b>'+(STANDALONE?'Synced with GitHub':'Saved to your account')+'</b><br>Your data follows you across devices.',
    local:'<b>Saved on this device only</b><br>'+(STANDALONE?'This device has not been connected yet. Restore a backup or turn on cloud sync below.':'Export a backup from Settings.'),
    error:'<b>Cloud save failed</b><br>'+(ui.syncErr?esc(ui.syncErr):'Data is still saved on this device.'),
    big:'<b>Too much data for cloud save</b><br>Saved on this device. Export a backup.',
    none:'<b>No storage available</b><br>Export a backup from Settings now.'

  return m[ui.sync]||m.local;
}
function isTyping(){var a=document.activeElement,n=a&&a.tagName;return n==='INPUT'||n==='TEXTAREA'||n==='SELECT';}
function safeRender(){if(!isTyping())render();}
async function reconcile(){
  var parts=Object.keys(DOCS),changed=false;
  for(var i=0;i<parts.length;i++){
    var p=parts[i],snap=await sync.refs[p].get();
    if(snap.exists){
      var body=snap.data()||{};
      if(body.json&&(body.updated||0)>(state.ts[p]||0)){
        var remote=JSON.parse(body.json);
        DOCS[p].forEach(function(k){if(remote[k]!==undefined)state[k]=remote[k];});
        state.ts[p]=body.updated;changed=true;continue;
      }
      if((state.ts[p]||0)>(body.updated||0))dirty[p]=1;
    }else{
      if(!state.ts[p])state.ts[p]=Date.now();
      dirty[p]=1;
    }
  }
  if(changed){state=normalize(state);persistLocal();safeRender();}
  await pushRemote();
}
/* ---- GitHub repo storage (standalone build) ---- */
var SYNC_KEY='lifeos.sync';
function syncCfg(){try{var c=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');return (c&&c.repo&&c.token)?c:null;}catch(e){return null;}}
function saveCfg(c){try{if(c)localStorage.setItem(SYNC_KEY,JSON.stringify(c));else localStorage.removeItem(SYNC_KEY);}catch(e){}}
function ghHeaders(cfg,json){
  var h={'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(json)h['Content-Type']='application/json';
  return h;
}
function ghError(res){
  var m=res.status===401?'GitHub rejected the token (401). Check that it is correct and not expired.'
    :res.status===403?'GitHub denied access (403). The token needs Contents: read and write on this repository.'
    :res.status===404?'Repository not found (404). Check the name and that the token can access it.'
    :'GitHub error '+res.status+'.';
  var e=new Error(m);e.status=res.status;return e;
}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));}
function repoRefs(cfg){
  var base='https://api.github.com/repos/'+cfg.repo+'/contents/',shas={},refs={};
  Object.keys(DOCS).forEach(function(p){
    var url=base+'lifeos-'+p+'.json';
    refs[p]={
      get:async function(){
        var res=await fetch(url,{headers:ghHeaders(cfg),cache:'no-store'});
        if(res.status===404){shas[p]=null;return {exists:false,data:function(){return undefined;}};}
        if(!res.ok)throw ghError(res);
        var j=await res.json(),obj={};
        shas[p]=j.sha;
        try{obj=JSON.parse(b64d(j.content||''));}catch(e){obj={};}
        return {exists:true,data:function(){return obj;}};
      },
      set:async function(obj){
        for(var attempt=0;attempt<2;attempt++){
          var body={message:'sync '+p,content:b64e(JSON.stringify(obj))};
          if(shas[p])body.sha=shas[p];
          var res=await fetch(url,{method:'PUT',headers:ghHeaders(cfg,true),body:JSON.stringify(body)});
          if(res.ok){var j=await res.json();shas[p]=(j.content&&j.content.sha)||null;return;}
          if((res.status===409||res.status===422)&&attempt===0){
            var r2=await fetch(url,{headers:ghHeaders(cfg),cache:'no-store'});
            shas[p]=r2.ok?(await r2.json()).sha:null;
            continue;
          }
          throw ghError(res);
        }
      }
    };
  });
  return refs;
}
function hasLocalData(){
  return Object.keys(state.log).length>0||Object.keys(state.workouts).length>0||state.money.tx.length>0||state.qnotes.length>0||Object.keys(state.notes).length>0;
}
async function connectRepo(){
  var repo=((($('#syncRepo')||{}).value)||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  var token=((($('#syncToken')||{}).value)||'').trim();
  ui.syncForm={repo:repo,token:token};
  if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo)){ui.msg='Enter the repository as owner/name, for example ahmed/life-os-data.';render();return;}
  if(!token){ui.msg='Paste your access token first.';render();return;}
  var cfg={repo:repo,token:token};
  try{
    var res=await fetch('https://api.github.com/repos/'+repo,{headers:ghHeaders(cfg),cache:'no-store'});
    if(!res.ok)throw ghError(res);
    var info=await res.json();
    if(info.private===false){ui.msg='That repository is public, so anyone could read your data. Create a private repository and use that one.';render();return;}
    var snap=await repoRefs(cfg).core.get();
    if(snap.exists&&hasLocalData()){ui.pending=cfg;ui.confirm='connect';render();return;}
    await finishConnect(cfg,snap.exists?'down':'up');
  }catch(e){ui.msg=(e&&e.message)||'Could not reach GitHub. Check your connection.';render();}
}
async function finishConnect(cfg,mode){
  if(!cfg)return;
  try{localStorage.setItem('lifeos.prebackup',JSON.stringify(state));}catch(e){}
  Object.keys(DOCS).forEach(function(p){if(mode==='down'){state.ts[p]=0;}else{state.ts[p]=Date.now();dirty[p]=1;}});
  persistLocal();
  saveCfg(cfg);ui.pending=null;ui.confirm='';ui.syncErr='';ui.syncForm=null;
  sync.refs=repoRefs(cfg);
  try{await reconcile();ui.msg=(mode==='down'?'Downloaded your cloud data.':'Cloud sync is on.');}
  catch(e){ui.syncErr=(e&&e.message)||'';setSync('error');ui.msg='Connected, but the first sync failed. '+ui.syncErr;}
  render();
}
function disconnectRepo(){
  saveCfg(null);sync.refs=null;dirty={};clearTimeout(pushT);ui.syncErr='';setSync('local');
  ui.msg='Cloud sync is off. Your data stays on this device.';render();
}
function resync(){
  if(!sync.refs||sync.busy||sync.rec)return Promise.resolve();
  sync.rec=true;lastPull=Date.now();
  return reconcile().catch(function(e){ui.syncErr=(e&&e.message)||'';setSync('error');}).then(function(){sync.rec=false;});
}
async function initSync(){
  try{
    var refs=null;
    if(STANDALONE){
      var cfg=syncCfg();if(cfg)refs=repoRefs(cfg);
    }else if(window.claude&&window.claude.use){
      var res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      var dbNs=res[0],userNs=res[1];
      if(dbNs&&userNs){
        var uid=await userNs.id();

      }
    }
    if(!refs)return;

  }catch(e){ui.syncErr=(e&&e.message)||'';setSync(sync.refs?'error':(storageOK?'local':'none'));}
  finally{sync.checked=true;if(ui.tab==='today')safeRender();}
}

}
function hideToast(){var el=$('#toast');if(el)el.hidden=true;}
function undoable(label,keys,parts,mutate){

function doUndo(){

    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){
        if(reg&&reg.showNotification)reg.showNotification(title,opts);else new Notification(title,opts);
      }).catch(function(){try{new Notification(title,opts);}catch(e){}});
    }else new Notification(title,opts);
  }catch(e){}
}
function checkDailyReminder(){
  var s=state.settings;
  if(!s.notify||!s.remindOn)return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var t=todayStr();
  if(s.lastRemindDate===t)return;
  var now=new Date(),hhmm=pad(now.getHours())+':'+pad(now.getMinutes());
  if(hhmm<(s.remindTime||'21:00'))return;
  if(minOK(t))return;
  s.lastRemindDate=t;touch('core');
  var opts={body:'You have not checked off today\u2019s essentials yet.',icon:'./icon-192.png',badge:'./icon-192.png',tag:'lifeos-daily',renotify:true};
  try{

      navigator.serviceWorker.ready.then(function(reg){if(reg&&reg.showNotification)reg.showNotification('Life OS',opts);else new Notification('Life OS',opts);}).catch(function(){try{new Notification('Life OS',opts);}catch(e){}});
    }else new Notification('Life OS',opts);
  }catch(e){}
}
function beep(freq,dur){
  if(!state.settings.sound)return;
  try{
    if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC();}
    if(actx.state==='suspended')actx.resume();
    var o=actx.createOscillator(),g=actx.createGain(),now=actx.currentTime,d=dur||0.15;
    o.type='triangle';o.frequency.value=freq||880;
    g.gain.setValueAtTime(0.0001,now);
    g.gain.exponentialRampToValueAtTime(0.34,now+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,now+d);
    o.connect(g);g.connect(actx.destination);
    o.start(now);o.stop(now+d+0.03);
  }catch(e){}
}
function chime(notes){
  if(!state.settings.sound)return;
  var t=0;
  notes.forEach(function(n){setTimeout(function(){beep(n[0],n[1]);},Math.round(t*1000));t+=n[2]!=null?n[2]:n[1];});
}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
var wake=null,wakeBusy=false;
function wakeCheck(){
  var need=!!((run&&!run.done)||pomo.running);
  if(need&&!wake&&!wakeBusy){
    wakeBusy=true;
    try{
      if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wake=l;wakeBusy=false;l.addEventListener('release',function(){wake=null;});}).catch(function(){wakeBusy=false;});}
      else wakeBusy=false;
    }catch(e){wakeBusy=false;}
  }else if(!need&&wake){try{wake.release();}catch(e){}wake=null;}
}
var ticker=null,run=null,rest=null;
var pomo={mode:'focus',running:false,end:0,remain:0,label:'',count:0};
function ensureTicker(){if(!ticker)ticker=setInterval(tick,250);}
function tick(){
  var now=Date.now();
  if(run&&!run.paused&&!run.done)tickRun(now);
  if(pomo.running)tickPomo(now);
  if(rest)tickRest(now);
  if(!(run&&!run.paused&&!run.done)&&!pomo.running&&!rest){clearInterval(ticker);ticker=null;}
}

/* ---- rest timer ---- */
function startRest(){

/* ---- pomodoro ---- */
function pomoLen(mode){var s=state.settings;return (mode==='focus'?s.focus:(mode==='short'?s.short:s.long))*60000;}
function pomoReset(mode){pomo.mode=mode||pomo.mode;pomo.running=false;pomo.remain=pomoLen(pomo.mode);}
pomoReset('focus');
function pomoStart(){if(pomo.running)return;pomo.end=Date.now()+pomo.remain;pomo.running=true;ensureTicker();updatePomoDom(pomo.remain);wakeCheck();}
function pomoPause(){if(!pomo.running)return;pomo.remain=pomo.end-Date.now();pomo.running=false;updatePomoDom(pomo.remain);wakeCheck();}
function updatePomoDom(ms){
  var t=$('#pomoTime');if(t)t.textContent=mmss(ms);
  var b=$('#pomoGo');if(b)b.textContent=pomo.running?'Pause':'Start';
  setRing('pomoRing',(1-ms/pomoLen(pomo.mode))*100);
  document.title=pomo.running?mmss(ms)+' '+(pomo.mode==='focus'?'Focus':'Break'):'Life OS';
}
function tickPomo(now){var rem=pomo.end-now;if(rem<=0)pomoComplete();else updatePomoDom(rem);}
function pomoComplete(){
  pomo.running=false;chime([[660,0.13],[988,0.3]]);buzz([200,100,200]);
  if(document.hidden)notify(pomo.mode==='focus'?'Focus session done':'Break is over',pomo.mode==='focus'?'Time for a break.':'Back to focus.');
  if(pomo.mode==='focus'){
    var d=todayStr(),f=state.focus[d]||(state.focus[d]={s:0,m:0,l:[]});
    f.s++;f.m+=state.settings.focus;if(pomo.label)f.l.push(pomo.label);
    autoTick('focus',d);touch('core');
    pomo.count++;pomoReset((pomo.count%state.settings.every===0)?'long':'short');
  }else{pomoReset('focus');}
  document.title='Life OS';wakeCheck();

/* ---- stretch runner ---- */
function stretchById(id){return STRETCH.find(function(r){return r.id===id;});}
function stretchTotal(r){return r.steps.reduce(function(a,s){return a+s.secs*(s.side?2:1);},0);}
function startRun(rid){
  var R=stretchById(rid);if(!R)return;
  var steps=[{n:'Get ready',secs:5,cue:'Find a spot with room to move. Breathe.',prep:true}];
  R.steps.forEach(function(st){
    if(st.side){steps.push({n:st.n,side:'Left side',secs:st.secs,cue:st.cue,area:st.area});steps.push({n:st.n,side:'Right side',secs:st.secs,cue:st.cue,area:st.area});}
    else steps.push({n:st.n,secs:st.secs,cue:st.cue,area:st.area});
  });
  var now=Date.now();
  run={rid:rid,steps:steps,i:0,end:now+steps[0].secs*1000,paused:false,remain:0,started:now,done:false,key:''};
  beep(660,0.1);
  $('#overlay').hidden=false;drawRun(now,true);ensureTicker();wakeCheck();
}
function tickRun(now){
  var guard=0;
  while(run&&!run.done&&run.end-now<=0&&guard<300){
    guard++;
    if(run.i>=run.steps.length-1){finishRun();return;}
    run.i++;run.end+=run.steps[run.i].secs*1000;beep(run.steps[run.i].prep?660:780,0.12);buzz(60);
  }
  drawRun(now);
}
function runElapsed(now){
  var e=0,i;for(i=0;i<run.i;i++)e+=run.steps[i].secs*1000;
  var cur=run.paused?run.remain:run.end-now;
  e+=run.steps[run.i].secs*1000-cur;return e;
}
function runTotal(){return run.steps.reduce(function(a,s){return a+s.secs*1000;},0);}
function updateRunLive(now){
  var st=run.steps[run.i],rem=run.paused?run.remain:run.end-now;
  var t=$('#runTime');if(t)t.textContent=mmss(rem);
  setRing('runRing',(1-rem/(st.secs*1000))*100);
  var b=$('#runBar');if(b)b.style.width=Math.min(100,Math.round(runElapsed(now)/runTotal()*100))+'%';
}
function drawRun(now,force){
  var el=$('#overlay');if(!run){el.hidden=true;return;}
  var R=stretchById(run.rid),key=run.i+'|'+run.paused+'|'+run.done;
  /* Only rebuild the buttons when the step or state changes, so taps are never lost to a re-render. */
  if(!force&&run.key===key&&$('#runTime')){updateRunLive(now);return;}
  run.key=key;
  if(run.done){
    el.innerHTML='<div class="stepno">Routine complete</div><h2>'+esc(R.name)+'</h2><p class="cue">Nice work. '+Math.round((Date.now()-run.started)/60000*10)/10+' min. It was logged for today'+(R.habit?' and ticked in your habits.':'.')+'</p><div class="btns" style="justify-content:center;margin-top:24px"><button class="btn pri" data-act="runclose">Done</button></div>';
    return;
  }
  var st=run.steps[run.i],rem=run.paused?run.remain:run.end-now,next=run.steps[run.i+1];
  el.style.setProperty('--c','var('+R.c+')');
  el.innerHTML='<div class="stepno">'+esc(R.name)+', step '+(run.i+1)+' of '+run.steps.length+'</div>'+
    '<h2>'+esc(st.n)+(st.side?' <span class="side">('+esc(st.side)+')</span>':'')+'</h2>'+
    (st.area?'<div class="tag">'+esc(st.area)+'</div>':'')+
    ringHTML('runRing',(1-rem/(st.secs*1000))*100,'<div class="timer-big" id="runTime">'+mmss(rem)+'</div>')+
    '<p class="cue">'+esc(st.cue)+'</p>'+
    '<div class="tbar" aria-label="Routine progress"><i id="runBar" style="width:'+Math.min(100,Math.round(runElapsed(now)/runTotal()*100))+'%"></i></div>'+
    '<p class="hint" style="margin-top:14px">'+(next?'Next: '+esc(next.n)+(next.side?' ('+esc(next.side)+')':''):'Last step')+'</p>'+
    '<div class="btns" style="justify-content:center;margin-top:20px"><button class="btn" data-act="runback">Back</button><button class="btn pri" data-act="runpause">'+(run.paused?'Resume':'Pause')+'</button><button class="btn" data-act="runskip">Skip</button><button class="btn dng" data-act="runstop">Stop</button></div>'+
    '<p class="hint" style="margin-top:16px">Move gently. Stop if you feel sharp pain. Space pauses, arrow keys skip.</p>';
}
function finishRun(){
  var d=todayStr(),R=stretchById(run.rid);
  var arr=state.stretchLog[d]||(state.stretchLog[d]=[]);
  arr.push({r:run.rid,t:Date.now()});

}

/* ================= charts ================= */
function lineChart(vals,labels,opts){
  opts=opts||{};

  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mn===mx){mn-=1;mx+=1;}
  var padv=(mx-mn)*0.12;var lo=opts.min!=null?opts.min:mn-padv,hi=opts.max!=null?opts.max:mx+padv;
  var x=function(i){return pl+(n>1?i*(W-pl-pr)/(n-1):(W-pl-pr)/2);},y=function(v){return pt+(hi-v)*(Hh-pt-pb)/(hi-lo);};
  var f=opts.fmt||fmt;
  var grid=[lo,(lo+hi)/2,hi].map(function(g){return '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(g).toFixed(1)+'" y2="'+y(g).toFixed(1)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y(g)+4).toFixed(1)+'" font-size="11" text-anchor="end" fill="var(--muted)">'+esc(f(g))+'</text>';}).join('');

  var l2='';
  if(opts.line2){var p2=[];opts.line2.forEach(function(v,i){if(v!=null)p2.push(x(i).toFixed(1)+','+y(v).toFixed(1));});if(p2.length>1)l2='<polyline points="'+p2.join(' ')+'" fill="none" stroke="var(--c-morning)" stroke-width="2" stroke-dasharray="5 4"/>';}

    '<path d="'+area+'" fill="var(--accent)" fill-opacity="0.10"/>'+l2+'<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+dots+

function radar(vals,labels){
  var S=300,cx=S/2,cy=S/2,Rr=100,n=labels.length,rings='',axes='',lbls='',pts=[];
  for(var k=1;k<=5;k++){var pp=[];for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n;pp.push((cx+Math.cos(a)*Rr*k/5).toFixed(1)+','+(cy+Math.sin(a)*Rr*k/5).toFixed(1));}

function latestRatedKey(prefix){
  var keys=Object.keys(state.reviews).filter(function(k){return k.indexOf(prefix)===0;}).sort().reverse();
  for(var i=0;i<keys.length;i++){var rr=state.reviews[keys[i]].r||{};if(Object.keys(rr).some(function(x){return rr[x];}))return keys[i];}
  return null;
}
function wheelLabel(key){
  var tp=key.charAt(0),v=key.slice(2);
  if(tp==='m'){var yy=+v.slice(0,4),mm=+v.slice(5,7);return MONTHS[mm-1]+' '+yy;}
  if(tp==='q'){var qp=v.split('-Q');return 'Q'+qp[1]+' '+qp[0];}
  return v;
}

function habitStreak(hid){
  var t=todayStr(),d=t,n=0,freeze=1;
  if(!isDone(hid,d))d=addDays(t,-1);
  while(n<400){
    if(isDone(hid,d)){n++;}
    else if(freeze>0){freeze--;}
    else break;
    d=addDays(d,-1);
  }
  return n;
}
function weekdayBars(){
  var t=todayStr(),sums=[0,0,0,0,0,0,0],cnt=[0,0,0,0,0,0,0],started=false,i,k;
  for(i=83;i>=0;i--){
    var d=addDays(t,-i),s=dayStats(d);
    if(s.done>0)started=true;
    if(!started||!s.total)continue;
    var w=parseD(d).getDay();sums[w]+=s.pct;cnt[w]++;
  }
  var items=[],any=false;
  for(k=0;k<7;k++){
    var wd=(state.settings.wk0+k)%7,p=cnt[wd]?Math.round(sums[wd]/cnt[wd]):0;
    if(cnt[wd])any=true;
    items.push({l:WDAYS[wd],c:'--accent',p:p,v:p+'%'});
  }
  if(!any)return '';
  return '<div class="panel"><h3>Average by weekday</h3><p class="hint" style="margin-bottom:8px">Last 12 weeks. It shows which days your system holds up and which need a plan.</p>'+barsHTML(items)+'</div>';
}
function streakRank(){
  var arr=activeHabits().map(function(h){return {n:h.n,s:habitStreak(h.id)};}).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).slice(0,5);
  return '<div class="rank"><h4>Running streaks</h4>'+(arr.map(function(x){return '<div><span>'+esc(x.n)+'</span><b>'+x.s+' d</b></div>';}).join('')||'<span class="hint">No streaks yet.</span>')+'</div>';
}

  return '<section class="line'+(folded?' folded':'')+(done===hs.length?' full':'')+'" style="--c:var(--accent)">'+
    '<button class="linehead" data-act="fold" data-s="'+fk+'" aria-expanded="'+(!folded)+'"><span class="lname">'+periodLabel(freq)+'</span><span class="lcount">'+esc(P.label)+' \u00b7 '+(done===hs.length?'Complete':done+' of '+hs.length)+'</span>'+icon('chev')+'</button>'+
    (folded?'':'<ol class="stops">'+stops+'</ol>')+'</section>';

function nextHabit(d){
  var all=activeHabits();
  for(var i=0;i<SECTIONS.length;i++){
    var hs=all.filter(function(h){return h.s===SECTIONS[i].id&&(!ui.minOnly||h.min);});
    for(var j=0;j<hs.length;j++){if(!isDone(hs[j].id,d))return hs[j];}
  }
  return null;
}
function weekStrip(d){
  var t=todayStr(),ws=weekStart(d),out='';
  for(var i=0;i<7;i++){
    var ds=addDays(ws,i),fut=ds>t,p=fut?0:dayStats(ds).pct,dt=parseD(ds);
    out+='<button class="wd'+(ds===d?' sel':'')+(ds===t?' now':'')+'" data-act="pickday" data-d="'+ds+'"'+(fut?' disabled':'')+' aria-label="'+esc(fmtLong(ds))+', '+p+' percent done"'+(ds===d?' aria-current="date"':'')+'><span class="wl">'+W3[dt.getDay()]+'</span><span class="wb"><i style="height:'+p+'%"></i></span><span class="wn">'+dt.getDate()+'</span></button>';
  }
  return '<div class="week">'+out+'</div>';
}

function viewMonth(){

    var sh=hs.filter(function(h){return h.s===s.id;});

    body+='<tr class="sh" style="--c:var('+s.c+')"><td colspan="'+(dim+3)+'">'+esc(s.name)+'</td></tr>';
    sh.forEach(function(h){
      var cnt=0,cells='';

function trainProgress(){
  var t=todayStr(),sel=ui.train.ex;

    var withH=state.exercises.find(function(e){return exHistory(e.id).length>0;});
    sel=withH?withH.id:(state.exercises[0]?state.exercises[0].id:'');ui.train.ex=sel;
  }
  var ex=exById(sel),hist=ex?exHistory(sel):[];
  var chart='<div class="empty">Log this exercise a few times to see progress.</div>',prBox='';
  if(ex&&hist.length){
    var vals=hist.map(function(h){return metricOf(ex,h.sets);}),labs=hist.map(function(h){return fmtDay(h.date);});
    var unit=ex.t==='lift'?'Estimated 1RM (kg)':(ex.t==='time'?'Best hold (s)':(ex.t==='cardio'?'Minutes':'Best reps'));
    chart='<p class="hint">'+esc(unit)+' per session</p><div class="chart">'+lineChart(vals,labs,{aria:ex.n+' progress'})+'</div>';
    var bestI=vals.indexOf(Math.max.apply(null,vals)),heavy=0,heavyR=0,bestVol=0;
    hist.forEach(function(h){h.sets.forEach(function(s){if((+s[0]||0)>heavy||((+s[0]||0)===heavy&&(+s[1]||0)>heavyR)){heavy=+s[0]||0;heavyR=+s[1]||0;}});var v=h.sets.reduce(function(a,s){return a+(+s[0]||0)*(+s[1]||0);},0);if(v>bestVol)bestVol=v;});
    prBox='<div class="kpis"><div class="kpi"><b>'+esc(fmt(vals[bestI]))+'</b><span>Best '+(ex.t==='lift'?'est. 1RM (kg)':'result')+' \u2013 '+esc(fmtDay(hist[bestI].date))+'</span></div>'+
      (ex.t==='lift'?'<div class="kpi"><b>'+esc(fmt(heavy))+' \u00D7 '+esc(fmt(heavyR))+'</b><span>Heaviest set</span></div><div class="kpi"><b>'+Math.round(bestVol).toLocaleString('en-US')+' kg</b><span>Best session volume</span></div>':'')+
      '<div class="kpi"><b>'+hist.length+'</b><span>Sessions logged</span></div></div>';
    var rows=hist.slice(-8).reverse().map(function(h){return '<li>'+esc(fmtDay(h.date))+': '+esc(h.sets.map(function(s){return setStr(ex,s);}).join(', '))+'</li>';}).join('');
    prBox+='<details class="hist" open><summary>Recent sessions</summary><ul>'+rows+'</ul></details>';
  }

  return '<div class="panel" style="margin-top:12px"><h3>Exercise progress</h3><select class="inp" id="progEx" data-progex="1" aria-label="Exercise">'+groupOptions(sel)+'</select><div style="margin-top:12px">'+chart+prBox+'</div></div>'+
    '<div class="panel"><h3>Workouts per week</h3><div class="chart">'+barChart(wk,wkl,{target:state.targets.wk,aria:'Workouts per week'})+'</div></div>'+
    '<div class="panel"><h3>Weekly volume (kg)</h3><div class="chart">'+barChart(vol,wkl,{color:'var(--c-learning)',aria:'Weekly volume'})+'</div></div>'+
    '<div class="panel"><h3>Sets per muscle group</h3><p class="hint">Last 7 days / last 28 days</p>'+gbars+'</div>';

function cmpS(a,b){return a<b?-1:(a>b?1:0);}

function go(tab,sub){

async function saveFile(name,data,okMsg){
  if(STANDALONE){
    try{
      var blob=new Blob([data],{type:/\.csv$/.test(name)?'text/csv':'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      ui.msg=okMsg||'Saved.';render();return 'saved';
    }catch(e0){}
  }
  try{
    var dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:data});ui.msg=okMsg||'Saved.';render();return 'saved';}
  }catch(e){if(e&&e.code==='declined'){ui.msg='Save cancelled.';render();return 'declined';}}
  ui.exportText=data;ui.msg='Copy this text and save it in a file.';render();return 'text';
}
async function doExport(){
  var r=await saveFile('life-os-backup-'+todayStr()+'.json',JSON.stringify(state,null,1),'Backup saved.');
  if(r!=='declined'){state.settings.lastExport=Date.now();touch('core');render();}
}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCsv(rows){return rows.map(function(r){return r.map(csvCell).join(',');}).join('\n');}
function habitsCsv(){
  var rows=[['date','section','habit']],t=todayStr(),start=addDays(t,-364);
  for(var i=0;i<365;i++){var d=addDays(start,i);state.habits.forEach(function(h){if((h.freq||'daily')==='daily'&&isDone(h.id,d))rows.push([d,SEC[h.s].name,h.n]);});}
  Object.keys(state.periodDone||{}).forEach(function(k){
    if(!state.periodDone[k])return;
    var i2=k.lastIndexOf('@'),hid=k.slice(0,i2),pkey=k.slice(i2+1),h=state.habits.find(function(x){return x.id===hid;});
    if(h)rows.push([pkey,SEC[h.s].name,h.n]);
  });
  return toCsv(rows);
}
function moneyCsv(){
  var rows=[['date','type','category','amount','envelope','note']];
  state.money.tx.slice().sort(function(a,b){return cmpS(a.d,b.d);}).forEach(function(x){
    rows.push([x.d,x.type==='in'?'income':'expense',x.cat,x.amt,x.type==='out'?(BUCK[txBucket(x)]||BUCK.ess).name:'',x.note||'']);
  });
  return toCsv(rows);
}
function doImport(){
  try{
    var s=JSON.parse(ui.importText||'');
    if(!s||!Array.isArray(s.habits))throw new Error('bad');
    state=normalize(s);touch('core','journal','train','money');ui.confirm='';ui.importText='';ui.msg='Import complete.';
  }catch(e){ui.confirm='';ui.msg='That text is not a valid backup.';}
  render();
}
function doReset(){state=defaultState();touch('core','journal','train','money');ui.confirm='';ui.msg='Everything was deleted and defaults restored.';render();}
function getSess(){return state.workouts[ui.date];}
function moveHabit(hid){
  var idx=state.habits.findIndex(function(x){return x.id===hid;});
  if(idx<=0)return null;
  var sid=state.habits[idx].s,j=idx-1;while(j>=0&&state.habits[j].s!==sid)j--;
  if(j<0)return null;
  var tmp=state.habits[idx];state.habits[idx]=state.habits[j];state.habits[j]=tmp;return tmp.id;
}
function moveHabitDown(hid){
  var idx=state.habits.findIndex(function(x){return x.id===hid;});
  if(idx<0)return null;
  var sid=state.habits[idx].s,j=idx+1;while(j<state.habits.length&&state.habits[j].s!==sid)j++;
  if(j>=state.habits.length)return null;
  var tmp=state.habits[idx];state.habits[idx]=state.habits[j];state.habits[j]=tmp;return tmp.id;
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act,h,d,n,s,x;
  switch(act){
    case 'undo':doUndo();break;
    case 'fold':{var fs=el.dataset.s;ui.fold[fs]=!ui.fold[fs];saveUI();render();break;}
    case 'foldall':{SECTIONS.forEach(function(sc){var hl=activeHabits().filter(function(hh){return hh.s===sc.id&&(!ui.minOnly||hh.min);});if(hl.length&&hl.every(function(hh){return isDone(hh.id,ui.date);}))ui.fold[sc.id]=true;});saveUI();render();break;}
    case 'unfoldall':ui.fold={};saveUI();render();break;
    case 'pickday':{var pd=el.dataset.d;if(pd&&pd<=todayStr()){ui.date=pd;render();}break;}
    case 'sset':ui.set=el.dataset.k;ui.confirm='';render();break;
    case 'msub':ui.money.sub=el.dataset.k;render();break;
    case 'theme':state.settings.theme=el.dataset.t;touch('core');render();break;
    case 'nudgex':ui.nudge=false;render();break;
    case 'hdown':{var mv2=moveHabitDown(el.dataset.h);if(mv2){touch('core');focusSel='[data-act="hdown"][data-h="'+mv2+'"]';render();}break;}
    case 'csvhabits':saveFile('life-os-habits-'+todayStr()+'.csv',habitsCsv(),'Habits CSV saved.');break;
    case 'csvmoney':saveFile('life-os-money-'+todayStr()+'.csv',moneyCsv(),'Money CSV saved.');break;
    case 'sconnect':connectRepo();break;
    case 'sdown':finishConnect(ui.pending,'down');break;
    case 'sup':finishConnect(ui.pending,'up');break;
    case 'sdisc':disconnectRepo();break;
    case 'snow':resync().then(function(){ui.msg=(ui.sync==='synced')?'Synced.':'Sync did not finish. See the message under Sync.';render();});break;
    case 'install':doInstall();break;
    case 'tab':if(el.dataset.set)ui.set=el.dataset.set;go(el.dataset.tab);break;
    case 'goto':go(el.dataset.tab,el.dataset.sub);break;
    case 'jump':{ui.tab='today';if(ui.fold[el.dataset.s]){ui.fold[el.dataset.s]=false;saveUI();}render();var sec=$('#sec-'+el.dataset.s);if(sec)sec.scrollIntoView({behavior:'smooth',block:'start'});break;}
    case 'toggle':{h=el.dataset.h;var was=isDone(h,ui.date);setDone(h,ui.date,!was);if(!was){buzz(12);ui.pop=h;}focusSel=el.classList.contains('nx-do')?'.nx-do':'[data-act="toggle"][data-h="'+h+'"]';render();break;}
    case 'cell':h=el.dataset.h;d=el.dataset.d;setDone(h,d,!isDone(h,d));focusSel='[data-act="cell"][data-h="'+h+'"][data-d="'+d+'"]';render();break;
    case 'daynav':n=Number(el.dataset.n);d=addDays(ui.date,n);if(d<=todayStr()){ui.date=d;ui.confirm='';render();}break;
    case 'gotoday':ui.date=todayStr();render();break;
    case 'minonly':ui.minOnly=!ui.minOnly;render();break;
    case 'ptoggle':{var hp=state.habits.find(function(x){return x.id===el.dataset.h;});if(hp){togglePeriodDone(hp,ui.date);buzz(12);render();}break;}
    case 'wheeltab':ui.stats=ui.stats||{};ui.stats.wheel=el.dataset.w;render();break;
    case 'mnav':ui.month=addMonths(ui.month,Number(el.dataset.n));render();break;
    case 'mnow':ui.month=todayStr().slice(0,7);render();break;
    case 'revtype':ui.rev.type=el.dataset.type;ui.rev.anchor=todayStr();render();break;
    case 'revnav':ui.rev.anchor=shiftAnchor(ui.rev.type,ui.rev.anchor,Number(el.dataset.n));render();break;
    case 'revnow':ui.rev.anchor=todayStr();render();break;
    case 'rvcheck':{var P=periodOf(ui.rev.type,ui.rev.anchor),r=revWrite(P.key),it=el.dataset.item;r.c[it]=!r.c[it];touch('journal');focusSel='[data-act="rvcheck"][data-item="'+it+'"]';render();break;}
    case 'rvrate':{var P2=periodOf(ui.rev.type,ui.rev.anchor),r2=revWrite(P2.key),it2=el.dataset.item,v=Number(el.dataset.n);r2.r[it2]=(r2.r[it2]===v)?0:v;touch('journal');focusSel='[data-act="rvrate"][data-item="'+it2+'"][data-n="'+v+'"]';render();break;}
    /* train: subtabs */
    case 'tsub':ui.train.sub=el.dataset.sub;ui.confirm='';render();break;
    /* train: workout log */
    case 'wstart':case 'wstartplan':{
      d=ui.date;if(!state.workouts[d])state.workouts[d]=buildSession(el.dataset.plan,d);touch('train');
      ui.train.sub='log';ui.tab='train';render();break;}
    case 'wopen':ui.date=el.dataset.d;ui.train.sub='log';render();window.scrollTo(0,0);break;
    case 'wdone':{s=getSess();if(!s)break;x=s.x[+el.dataset.x];var st=x.s[+el.dataset.s];st[3]=st[3]===1?0:1;
      if(st[3]===1){if(sessionDone(s))autoTick('training',ui.date);startRest();}
      touch('train');focusSel='[data-act="wdone"][data-x="'+el.dataset.x+'"][data-s="'+el.dataset.s+'"]';render();break;}
    case 'wsetadd':{s=getSess();x=s.x[+el.dataset.x];var ex=exById(x.e),last=x.s[x.s.length-1]||['','','',0];x.s.push([last[0],last[1],'',0]);touch('train');render();break;}
    case 'wsetrm':{s=getSess();x=s.x[+el.dataset.x];x.s.splice(+el.dataset.s,1);touch('train');render();break;}

    case 'wadd':{s=getSess();var id=$('#wAddEx').value,exx=exById(id);if(s&&exx){var sg=suggestFor(exx,[8,12],ui.date),sets=[],cnt=exx.t==='cardio'?1:3;for(var i=0;i<cnt;i++)sets.push([sg.w,sg.r,'',0]);s.x.push({e:id,s:sets});touch('train');render();}break;}
    case 'wdel':undoable('Workout deleted',['workouts'],['train'],function(){delete state.workouts[ui.date];});break;
    /* plans */
    case 'plnew':{var pid=nid(state,'p');state.plans.push({id:pid,n:'New plan',items:[]});ui.train.plan=pid;touch('train','core');render();break;}
    case 'pledit':ui.train.plan=el.dataset.p;render();break;
    case 'pldone':ui.train.plan='';ui.confirm='';render();break;
    case 'pladd':{var pl=planById(ui.train.plan),eid=$('#plAddEx').value;if(pl&&eid){pl.items.push({e:eid,sets:3,reps:'8-12'});touch('train');render();}break;}
    case 'plrm':{var pl2=planById(ui.train.plan);if(pl2){pl2.items.splice(+el.dataset.i,1);touch('train');render();}break;}
    case 'plup':{var pl3=planById(ui.train.plan),i3=+el.dataset.i;if(pl3&&i3>0){var t3=pl3.items[i3];pl3.items[i3]=pl3.items[i3-1];pl3.items[i3-1]=t3;touch('train');render();}break;}
    case 'pldel':{var pdid=ui.train.plan;undoable('Plan deleted',['plans'],['train'],function(){state.plans=state.plans.filter(function(p){return p.id!==pdid;});ui.train.plan='';});break;}
    /* exercises */
    case 'exadd':{var nm=($('#newEx').value||'').trim();if(!nm)break;state.exercises.push({id:nid(state,'e'),n:nm,g:$('#newExG').value,t:$('#newExT').value,inc:$('#newExT').value==='lift'?2.5:0});touch('train','core');render();break;}
    case 'exdel':{var edid=el.dataset.e;undoable('Exercise deleted',['exercises','plans'],['train'],function(){state.exercises=state.exercises.filter(function(q){return q.id!==edid;});state.plans.forEach(function(p){p.items=p.items.filter(function(i){return i.e!==edid;});});});break;}
    /* stretch */
    case 'runstart':startRun(el.dataset.r);break;
    case 'runpause':{if(!run||run.done)break;var now=Date.now();if(run.paused){run.paused=false;run.end=now+run.remain;ensureTicker();}else{run.paused=true;run.remain=run.end-now;}drawRun(now);break;}
    case 'runskip':{if(!run||run.done)break;var n1=Date.now();if(run.i>=run.steps.length-1){finishRun();}else{run.i++;run.end=n1+run.steps[run.i].secs*1000;run.paused=false;ensureTicker();drawRun(n1);}break;}
    case 'runback':{if(!run||run.done)break;var n2=Date.now();run.i=Math.max(0,run.i-1);run.end=n2+run.steps[run.i].secs*1000;run.paused=false;ensureTicker();drawRun(n2);break;}
    case 'runstop':closeRun();break;
    case 'runclose':closeRun();break;
    /* rest */
    case 'restskip':rest=null;drawRest(Date.now());break;
    case 'restadd':if(rest){rest.end+=30000;drawRest(Date.now());}break;
    /* focus */
    case 'pgo':beep(660,0.05);if(pomo.running)pomoPause();else pomoStart();break;
    case 'preset':pomoReset(pomo.mode);updatePomoDom(pomo.remain);break;
    case 'pskip':pomoReset(pomo.mode==='focus'?'short':'focus');render();break;
    case 'pmode':pomoReset(el.dataset.m);render();break;
    /* goals */
    case 'gadd':{var ti=($('#gTitle').value||'').trim();if(!ti){ui.msg='Give the goal a title.';render();break;}state.goals.push({id:nid(state,'g'),t:ti,a:$('#gArea').value,due:$('#gDue').value||'',w:($('#gWhy').value||'').trim(),p:0,steps:[],done:false});touch('core');ui.msg='';render();break;}
    case 'gdone':{var g=state.goals.find(function(q){return q.id===el.dataset.g;});if(g){g.done=!g.done;touch('core');render();}break;}
    case 'gstep':{var g2=state.goals.find(function(q){return q.id===el.dataset.g;});if(g2){var stp=g2.steps[+el.dataset.s];stp.d=!stp.d;touch('core');focusSel='[data-act="gstep"][data-g="'+g2.id+'"][data-s="'+el.dataset.s+'"]';render();}break;}
    case 'gaddstep':{var g3=state.goals.find(function(q){return q.id===el.dataset.g;});var inp=document.querySelector('[data-gnew="'+el.dataset.g+'"]');var tx=inp?inp.value.trim():'';if(g3&&tx){g3.steps.push({x:tx,d:false});touch('core');render();}break;}
    case 'gdel':{var gdid=el.dataset.g;undoable('Goal deleted',['goals'],['core'],function(){state.goals=state.goals.filter(function(q){return q.id!==gdid;});});break;}
    /* notes */
    case 'nadd':{var nn={id:nid(state,'n'),t:'',b:'',pin:false,ts:Date.now(),upd:Date.now()};state.qnotes.unshift(nn);touch('journal');focusSel='[data-nt="'+nn.id+'"]';render();break;}
    case 'npin':{var nt=(state.qnotes||[]).find(function(q){return q.id===el.dataset.n;});if(nt){nt.pin=!nt.pin;touch('journal');render();}break;}
    case 'ndel':{var ndid=el.dataset.n;undoable('Note deleted',['qnotes'],['journal'],function(){state.qnotes=(state.qnotes||[]).filter(function(q){return q.id!==ndid;});});break;}
    /* money */
    case 'mtype':ui.money.type=el.dataset.t;render();break;
    case 'madd':{
      var amt=num($('#mAmt').value);
      if(!amt||amt<=0){ui.msg='Enter an amount greater than 0.';render();break;}
      var cat=$('#mCat').value,date=$('#mDate').value||todayStr(),note=($('#mNote').value||'').trim();
      var txo={id:nid(state,'tx'),d:date,type:ui.money.type,cat:cat,amt:amt,note:note};
      if(ui.money.type==='out'){var bEl=$('#mBucket');if(bEl)txo.k=bEl.value;}
      state.money.tx.push(txo);
      touch('money');ui.msg='';render();break;}
    case 'mdel':{var mdid=el.dataset.id;undoable('Transaction deleted',['money'],['money'],function(){state.money.tx=state.money.tx.filter(function(q){return q.id!==mdid;});});break;}
    case 'mmnav':ui.money.month=addMonths(ui.money.month,Number(el.dataset.n));render();break;
    case 'mmnow':ui.money.month=todayStr().slice(0,7);render();break;
    /* settings */
    case 'tsound':state.settings.sound=!state.settings.sound;touch('core');render();break;
    case 'tauto':state.settings.auto=!state.settings.auto;touch('core');render();break;
    case 'tmindef':state.settings.minDefault=!state.settings.minDefault;touch('core');render();break;
    case 'tnotify':{
      if(!state.settings.notify){
        if(!('Notification' in window)){ui.msg='Notifications are not supported in this browser.';render();break;}
        if(Notification.permission==='granted'){state.settings.notify=true;touch('core');render();break;}
        Notification.requestPermission().then(function(p){state.settings.notify=(p==='granted');if(p!=='granted')ui.msg='Notification permission was not granted.';touch('core');render();});
        break;
      }
      state.settings.notify=false;touch('core');render();break;}
    case 'tremind':{
      if(!state.settings.remindOn){
        if(!('Notification' in window)){ui.msg='Notifications are not supported in this browser.';render();break;}
        if(Notification.permission==='granted'){state.settings.notify=true;state.settings.remindOn=true;state.settings.lastRemindDate='';touch('core');syncReminderStatus();registerPeriodicSync();render();break;}
        Notification.requestPermission().then(function(p){
          if(p==='granted'){state.settings.notify=true;state.settings.remindOn=true;state.settings.lastRemindDate='';syncReminderStatus();registerPeriodicSync();}else{ui.msg='Notification permission was not granted.';}
          touch('core');render();
        });
        break;
      }
      state.settings.remindOn=false;touch('core');syncReminderStatus();render();break;}
    case 'hmin':{var hb=state.habits.find(function(q){return q.id===el.dataset.h;});if(hb){hb.min=!hb.min;touch('core');focusSel='[data-act="hmin"][data-h="'+hb.id+'"]';render();}break;}
    case 'harch':case 'hrest':{var hc=state.habits.find(function(q){return q.id===el.dataset.h;});if(hc){hc.on=(act==='hrest');touch('core');render();}break;}
    case 'hmove':{var mv=moveHabit(el.dataset.h);if(mv){touch('core');focusSel='[data-act="hmove"][data-h="'+mv+'"]';render();}break;}
    case 'hadd':{var nm2=($('#newName').value||'').trim(),sc=$('#newSec').value,fq=($('#newFreq')||{}).value;
      if(!nm2){ui.msg='Enter a habit name first.';render();break;}
      state.habits.push({id:'h'+pad(state.nextId++),s:sc,n:nm2,min:false,on:true,freq:FREQ_SET[fq]?fq:'daily',k:''});touch('core');ui.msg='Added: '+nm2;render();break;}
    case 'export':doExport();break;
    case 'import':if(!(ui.importText||'').trim()){ui.msg='Paste a backup first.';}else{ui.confirm='import';ui.msg='';}render();break;
    case 'importgo':doImport();break;
    case 'reset':ui.confirm='reset';render();break;
    case 'resetgo':doReset();break;
    case 'cancel':ui.confirm='';render();break;
  }
});

document.addEventListener('input',function(e){
  var t=e.target,ds=t.dataset;
  if(t.tagName==='TEXTAREA'&&t.classList.contains('auto'))fit(t);
  if(ds.note){var n=state.notes[ui.date]||(state.notes[ui.date]={});n[ds.note]=t.value;touch('journal');}
  else if(ds.rvt){var P=periodOf(ui.rev.type,ui.rev.anchor),r=revWrite(P.key);r.t[ds.rvt]=t.value;touch('journal');}
  else if(ds.wset){var p=ds.wset.split(':'),s=getSess();if(s){s.x[+p[0]].s[+p[1]][+p[2]]=num(t.value);touch('train');}}
  else if(ds.wnote){var s2=getSess();if(s2){s2.nt=t.value;touch('train');}}
  else if(ds.body){
    var b=state.body[ui.date]||(state.body[ui.date]={}),v=num(t.value);
    b[ds.body]=v;touch('core');
    if(v>0){
      if(ds.body==='cal')autoTick('cal',ui.date);
      if(ds.body==='pro')autoTick('pro',ui.date);
      if(ds.body==='sl'&&v>=state.targets.sleep)autoTick('sleep',ui.date);
      renderTop();
    }
  }
  else if(ds.pi){var q=ds.pi.split(':'),pl=planById(ui.train.plan);if(pl&&pl.items[+q[0]]){pl.items[+q[0]][q[1]]=(q[1]==='sets')?(parseInt(t.value,10)||1):t.value;touch('train');}}
  else if(ds.plname){var pl2=planById(ui.train.plan);if(pl2){pl2.n=t.value||'Plan';touch('train');}}
  else if(ds.prog){var pk=ds.prog;state.program=state.program||{};if(pk==='start')state.program.start=t.value||'';else state.program[pk]=Math.max(1,parseInt(t.value,10)||1);touch('train');render();}
  else if(ds.plabel){pomo.label=t.value;}
  else if(ds.gp){var g=state.goals.find(function(z){return z.id===ds.gp;});if(g){g.p=Number(t.value);touch('core');}}
  else if(ds.gt){var g0=state.goals.find(function(z){return z.id===ds.gt;});if(g0){g0.t=t.value;touch('core');}}
  else if(ds.nt){var qn=(state.qnotes||[]).find(function(z){return z.id===ds.nt;});if(qn){qn.t=t.value;qn.upd=Date.now();touch('journal');}}
  else if(ds.nb){var qn2=(state.qnotes||[]).find(function(z){return z.id===ds.nb;});if(qn2){qn2.b=t.value;qn2.upd=Date.now();touch('journal');}}
  else if(t.id==='noteSearch'){ui.notes.q=t.value;var nl=$('#noteList');if(nl){nl.innerHTML=notesListHTML();nl.querySelectorAll('textarea.auto').forEach(fit);}}
  else if(t.id==='importBox'){ui.importText=t.value;}
});
document.addEventListener('change',function(e){
  var t=e.target,ds=t.dataset;
  if(ds.hn){var h=state.habits.find(function(x){return x.id===ds.hn;});var v=t.value.trim();if(h&&v){h.n=v;touch('core');}else if(h){t.value=h.n;}}
  else if(ds.hafter){var h9=state.habits.find(function(x){return x.id===ds.hafter;});if(h9){h9.after=t.value.trim();touch('core');}}
  else if(ds.pgoal){var pn=state.notes[ui.date]||(state.notes[ui.date]={});pn[ds.pgoal]=t.value;touch('journal');}
  else if(ds.remindtime){state.settings.remindTime=/^\d\d:\d\d$/.test(t.value)?t.value:'21:00';state.settings.lastRemindDate='';touch('core');syncReminderStatus();}
  else if(ds.hs){var h2=state.habits.find(function(x){return x.id===ds.hs;});if(h2&&SEC[t.value]){h2.s=t.value;touch('core');render();}}
  else if(ds.hf){var h6=state.habits.find(function(x){return x.id===ds.hf;});if(h6&&FREQ_SET[t.value]){h6.freq=t.value;touch('core');render();}}
  else if(ds.exn){var ex=exById(ds.exn);if(ex&&t.value.trim()){ex.n=t.value.trim();touch('train');}}
  else if(ds.exg){var e2=exById(ds.exg);if(e2){e2.g=t.value;touch('train');render();}}
  else if(ds.ext){var e3=exById(ds.ext);if(e3){e3.t=t.value;touch('train');}}
  else if(ds.exi){var e4=exById(ds.exi);if(e4){e4.inc=num(t.value)||0;touch('train');}}
  else if(ds.progex){ui.train.ex=t.value;render();}
  else if(ds.mbud){state.money.budgets=state.money.budgets||{};state.money.budgets[ds.mbud]=num(t.value)||0;touch('money');render();}
  else if(ds.split){state.money.split[ds.split]=Math.max(0,Math.min(100,num(t.value)||0));touch('money');render();}
  else if(ds.mg){state.money.shortGoal[ds.mg]=(ds.mg==='t')?(num(t.value)||0):t.value;touch('money');render();}
  else if(ds.gd){var g1=state.goals.find(function(z){return z.id===ds.gd;});if(g1){g1.due=t.value;touch('core');render();}}
  else if(ds.cur){state.settings.cur=(t.value||'').trim().slice(0,6)||'EGP';touch('core');}
  else if(ds.wk0){state.settings.wk0=+t.value;touch('core');render();}
  else if(t.id==='mCat'){var bk=$('#mBucket');if(bk&&CAT_BUCKET[t.value])bk.value=CAT_BUCKET[t.value];}
  else if(t.id==='importFile'){
    var file=t.files&&t.files[0];
    if(file){var fr=new FileReader();fr.onload=function(){
      ui.importText=String(fr.result||'');
      try{var chk=JSON.parse(ui.importText);if(!chk||!Array.isArray(chk.habits))throw 0;ui.confirm='import';ui.msg='';}
      catch(e){ui.confirm='';ui.msg='That file is not a valid Life OS backup.';}
      render();
    };fr.onerror=function(){ui.msg='Could not read that file.';render();};fr.readAsText(file);}
  }
  else if(ds.cfg){
    var p=ds.cfg.split(':'),val=num(t.value);
    if(p[0]==='t'){state.targets[p[1]]=(val===''?0:val);}
    else{state.settings[p[1]]=(val===''?0:val);if(p[1]!=='rest'&&!pomo.running)pomoReset(pomo.mode);}
    touch('core');
  }
});
document.addEventListener('keydown',function(e){
  var a=document.activeElement;
  if(run&&!run.done&&(!a||a===document.body||a.id==='overlay')){
    var sel=null;
    if(e.key===' ')sel='[data-act="runpause"]';
    else if(e.key==='ArrowRight')sel='[data-act="runskip"]';
    else if(e.key==='ArrowLeft')sel='[data-act="runback"]';
    var btn=sel&&$(sel);
    if(btn){e.preventDefault();btn.click();}
    return;
  }
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&a&&a.getAttribute&&a.getAttribute('role')==='tab'){
    var tabs=Array.prototype.slice.call(a.parentNode.querySelectorAll('[role="tab"]')),i=tabs.indexOf(a);
    var nx=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];
    if(nx){e.preventDefault();focusTabIdx=Array.prototype.indexOf.call(document.querySelectorAll('.subtabs'),a.parentNode);nx.click();}
  }
});

/* keep timers accurate, keep data safe, and pick up changes from other devices */
document.addEventListener('visibilitychange',function(){
  if(document.hidden){clearTimeout(saveT);persistLocal();return;}
  if(ticker)tick();
  wakeCheck();
  checkDailyReminder();
  if(sync.refs&&!isTyping()&&Date.now()-lastPull>15000)resync();
});
window.addEventListener('pagehide',function(){clearTimeout(saveT);persistLocal();});
window.addEventListener('online',function(){resync();});

/* installable app (standalone build only) */
function doInstall(){
  var ev=ui.installEv;if(!ev)return;
  ev.prompt();
  ev.userChoice.then(function(){ui.installEv=null;render();},function(){});
}
if(STANDALONE){
  var hadController=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadController)toast('A new version was installed. Reload to use it.');hadController=true;});
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ui.installEv=e;if(ui.tab==='settings'&&ui.set==='data')safeRender();});
  window.addEventListener('appinstalled',function(){ui.installEv=null;});
}

render();
setTimeout(initSync,0);
checkDailyReminder();
syncReminderStatus();
if(state.settings.remindOn)registerPeriodicSync();
setInterval(checkDailyReminder,60000);
})();
</script>
</body>
</html>
